name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Monday morning: refresh the weekly homepage pick even without a source push.
    - cron: '17 10 * * 1'
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate video catalog generation
        run: |
          node --test frontend/scripts/tests/home-blog-covers.test.mjs frontend/scripts/tests/blog-consolidation-policy.test.mjs frontend/scripts/tests/blog-editorial.test.mjs frontend/scripts/tests/static-translation-routes.test.mjs frontend/scripts/tests/blog-translations.test.mjs frontend/scripts/tests/content-consolidation.test.mjs frontend/scripts/tests/release-locales.test.mjs frontend/scripts/tests/game-journal.test.mjs scripts/tests/generate-videos-data.test.mjs frontend/scripts/tests/video-transcript-validation.test.mjs frontend/scripts/tests/weekly-feature.test.mjs frontend/scripts/tests/fitness-metrics.test.mjs
          python3 frontend/scripts/tests/monitor-site-health.test.py
          python3 scripts/tests/blog-source-identity.test.py
          python3 scripts/tests/blog-editorial-policy.test.py
          python3 scripts/tests/blog-daily-sources.test.py
          python3 scripts/tests/blog-manual-release.test.py
          python3 scripts/tests/blog-quality.test.py
          python3 scripts/tests/blog-sections.test.py
          python3 scripts/tests/video-transcripts.test.py
          python3 scripts/tests/nightly-game-journal.test.py

      - name: Generate video data catalog
        run: node scripts/generate_videos_data.mjs

      - name: Build with Astro
        run: npm run build
        working-directory: frontend
        env:
          SITE: https://tobyonfitnesstech.com
          # Workout hub ships as a static catalogue: no Supabase credentials
          # and no connect flag, so the page makes no network calls and never
          # reports a failed backend connection. To turn on leaderboards and
          # Speediance connect, add PUBLIC_SUPABASE_URL (https) and
          # PUBLIC_SUPABASE_ANON_KEY as repository variables and set
          # PUBLIC_WORKOUT_HUB_CONNECT=true, once a hosted Supabase project
          # exists. Pointing these at a machine on the LAN will not work.
          PUBLIC_WORKOUT_HUB_ENABLED: "true"
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test deployment asset retention and visibility safeguards
        run: node --test frontend/scripts/tests/retain-deploy-assets.test.mjs frontend/scripts/tests/gsc-data-quality.test.mjs

      - name: Preserve recently used hashed browser assets
        run: |
          git fetch --no-tags --shallow-since="$(date -u -d '35 days ago' +%Y-%m-%d)" origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          node frontend/scripts/retain-deploy-assets.mjs frontend/dist

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "deploy: ${{ github.sha }}"

      - name: Notify IndexNow after publishing
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
        working-directory: frontend
